name: Build desktop app (Windows, macOS and Linux)

# Builds JetStream Desktop for Windows (the portable .zip, the main download, plus the .msi and
# setup .exe installers), macOS (a .dmg), and Linux (a portable .zip plus .AppImage and .deb),
# each uploaded as a workflow artifact. It runs on pushes
# that change the app (any branch), by hand from the Actions tab, and on tags like
# desktop-v0.2.0. Main pushes bump the patch version and create a draft after successful builds.
#
# Versions: desktop/src-tauri/tauri.conf.json is the source of truth; set_version.py keeps the
# other desktop version files in sync. The Python package is versioned separately. Every build also
# carries its build number and commit (JETSTREAM_BUILD / JETSTREAM_COMMIT below), shown in the
# app and in the portable zip's name: JetStream-0.2.0-build18-windows-x64-portable.zip.
#
# Linux builds on ubuntu-22.04 so the AppImage also runs on older distributions.
# To build locally instead: desktop/scripts/build_windows.ps1 or desktop/scripts/build_desktop.py.
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "desktop-v*"
    # Path filters apply to branch pushes only; tag pushes always build.
    paths:
      - "desktop/**"
      - "jetstream/**"
      - "requirements.txt"
      - ".github/workflows/desktop.yml"
      - "desktop/scripts/**"
      # Documentation-only changes don't rebuild (and don't cancel a build in progress).
      - "!**/*.md"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_ref: ${{ steps.version.outputs.build_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump desktop patch version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          current=$(git rev-parse FETCH_HEAD)
          if [ "$current" != "$GITHUB_SHA" ]; then
            parent=$(git rev-parse "$current^" 2>/dev/null || true)
            subject=$(git log -1 --format=%s "$current")
            if [ "$parent" = "$GITHUB_SHA" ] && [[ "$subject" == 'Bump desktop version to '* ]]; then
              echo "build_ref=$current" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main advanced since this run started; refusing to overwrite newer changes." >&2
            exit 1
          fi
          python desktop/scripts/set_version.py --bump-patch
          version=$(python desktop/scripts/set_version.py --show)
          tag="desktop-v${version}"
          existing=$(git ls-remote --tags origin "refs/tags/$tag")
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if [ -n "$existing" ] || printf '%s\n' "$releases" | grep -Fxq "$tag"; then
            echo "Tag or release $tag already exists; refusing to reuse its version." >&2
            exit 1
          fi
          python desktop/scripts/release_notes.py "$version" --record-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/CHANGELOG.md desktop/package.json desktop/package-lock.json desktop/src-tauri/tauri.conf.json desktop/src-tauri/Cargo.toml desktop/transfer/Cargo.toml
          git commit -m "Bump desktop version to $version"
          git push origin HEAD:main
          echo "build_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    if: always() && !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      JETSTREAM_BUILD: ${{ github.run_number }}
      JETSTREAM_COMMIT: ${{ needs.prepare-release.outputs.build_ref || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.build_ref || github.sha }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check the desktop version
        # The version files must agree; a release tag must match them.
        run: python desktop/scripts/set_version.py --check ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('--tag {0}', github.ref_name) || '' }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target
            desktop/transfer -> target

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build bundled JetStream server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python desktop/scripts/build_sidecar.py ${{ runner.os != 'macOS' && '--portable' || '' }}

      - name: Build JetStream upload engine
        run: python desktop/scripts/build_engine.py

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci || npm install

      - name: Test UI helpers
        working-directory: desktop
        run: npm run test:ui

      - name: Release notes
        # A release tag needs a section for its version in desktop/CHANGELOG.md; that section
        # becomes the release's description.
        id: notes
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          python desktop/scripts/release_notes.py "${{ github.ref_name }}" -o release-notes.md
          {
            echo "body<<JETSTREAM_NOTES_END"
            cat release-notes.md
            echo "JETSTREAM_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('JetStream Desktop {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package portable build and collect installers
        # JetStream-<version>-build<N>-<windows|linux>-x64-portable.zip (unzip and run, no
        # install; the server is a folder inside it) plus the installers: .msi and setup .exe on
        # Windows, .dmg on macOS, and .AppImage and .deb on Linux.
        run: python desktop/scripts/build_desktop.py --package-only

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: jetstream-desktop-${{ matrix.platform }}-installers
          path: |
            desktop/release/*
            !desktop/release/*-portable.zip
          if-no-files-found: error

      - name: Upload portable build
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: jetstream-desktop-${{ matrix.platform }}-portable
          path: desktop/release/*-portable.zip
          if-no-files-found: error

      - name: Attach portable build to the draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v') && runner.os != 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: desktop/release/*-portable.zip

  draft-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare-release.result == 'success'
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: desktop-draft-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.build_ref }}

      - name: Prepare release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python desktop/scripts/set_version.py --show)
          tag="desktop-v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          existing=$(git ls-remote --tags origin "refs/tags/$tag")
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if [ -n "$existing" ] || printf '%s\n' "$releases" | grep -Fxq "$tag"; then
            echo "Tag or release $tag already exists; leaving it unchanged."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            python desktop/scripts/release_notes.py "$tag" -o release-notes.md
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.release.outputs.create == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: jetstream-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        if: steps.release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$RELEASE_TAG" release-assets/* --draft --target "${{ needs.prepare-release.outputs.build_ref }}" --title "JetStream Desktop $RELEASE_TAG" --notes-file release-notes.md
